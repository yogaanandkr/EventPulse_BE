- name: Deploy to AWS EC2
  env:
    EC2_HOST: ${{ secrets.EC2_HOST }}
    EC2_USER: ${{ secrets.EC2_USER }}
    EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

  run: |
    echo "Preparing SSH..."

    mkdir -p ~/.ssh

    printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/eventpulse_key
    chmod 600 ~/.ssh/eventpulse_key

    echo "Scanning EC2 host key..."
    ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

    echo "Testing SSH connection..."
    ssh -i ~/.ssh/eventpulse_key \
      -o BatchMode=yes \
      "$EC2_USER@$EC2_HOST" "echo 'SSH connection successful'"

    echo "Starting deployment..."

    ssh -i ~/.ssh/eventpulse_key "$EC2_USER@$EC2_HOST" << 'EOF'
      set -e

      echo "Connected to EC2"
      whoami

      echo "Opening EventPulse_BE..."
      cd ~/EventPulse_BE

      echo "Pulling latest code..."
      git pull origin main

      echo "Installing dependencies..."
      npm ci

      echo "Building backend..."
      npm run build

      echo "Restarting EventPulse..."
      pm2 restart eventpulse-api

      echo "Saving PM2 configuration..."
      pm2 save

      echo "Deployment successful"
    EOF
