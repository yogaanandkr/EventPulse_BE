- name: Configure SSH
  env:
    EC2_HOST: ${{ secrets.EC2_HOST }}
    EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

  run: |
    mkdir -p ~/.ssh

    # Use echo -e to properly handle newlines in the SSH key
    echo "$EC2_SSH_KEY" > ~/.ssh/eventpulse_key

    chmod 600 ~/.ssh/eventpulse_key

    # Add timeout and capture errors
    ssh-keyscan -T 5 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>&1 || echo "Warning: ssh-keyscan failed"

- name: Deploy EventPulse
  env:
    EC2_HOST: ${{ secrets.EC2_HOST }}
    EC2_USER: ${{ secrets.EC2_USER }}

  run: |
    ssh -i ~/.ssh/eventpulse_key \
        -o ConnectTimeout=10 \
        -o StrictHostKeyChecking=accept-new \
        -o BatchMode=yes \
        "$EC2_USER@$EC2_HOST" << 'EOF'

      set -e
      
      echo "Starting deployment..."
      
      cd ~/EventPulse_BE || { echo "Error: Directory not found"; exit 1; }
      
      echo "Pulling latest code..."
      git pull origin main || { echo "Error: git pull failed"; exit 1; }
      
      echo "Installing dependencies..."
      npm ci || { echo "Error: npm ci failed"; exit 1; }
      
      echo "Building application..."
      npm run build || { echo "Error: build failed"; exit 1; }
      
      echo "Restarting application..."
      pm2 restart eventpulse-api || { echo "Error: pm2 restart failed"; exit 1; }
      
      pm2 save
      
      echo "Deployment complete!"

    EOF
