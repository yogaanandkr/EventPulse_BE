name: EventPulse Backend CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

        run: |
          echo "Creating SSH directory..."
          mkdir -p ~/.ssh

          echo "Creating private key..."
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/eventpulse_key
          chmod 600 ~/.ssh/eventpulse_key

          echo "Scanning EC2 SSH host..."
          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts

          echo "SSH configuration complete."

      - name: Deploy EventPulse
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

        run: |
          ssh -i ~/.ssh/eventpulse_key "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e

            echo "Connected to EC2"

            cd ~/EventPulse_BE

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            npm ci

            echo "Building application..."
            npm run build

            echo "Restarting EventPulse..."
            pm2 restart eventpulse-api

            pm2 save

            echo "Deployment successful"
          EOF